version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # This project has no runtime dependencies on purpose, so everything here is
    # a development one. Splitting them by risk rather than by that label: a
    # toolchain major is a piece of work, and a patch to a linter is not.
    groups:
      # Packages that cannot move alone, whatever the size of the step.
      #
      # The first version of this file grouped only minor and patch updates and
      # let every major arrive by itself, on the reasoning that a major needs
      # reading rather than merging. That is true and it is not enough: some
      # majors cannot be read on their own either.
      #
      # Measured on the first run. Dependabot opened one pull request for
      # `vitest` 4 and another for `@vitest/coverage-v8` 4, and both died at
      # `npm ci` with `peer vitest@` — each is a peer of the other, so neither
      # can pass without its twin. Left like this, Dependabot would reopen the
      # same two impossible pull requests every week for ever.
      vitest:
        patterns: ['vitest', '@vitest/*']
        update-types: [major, minor, patch]
      # `typescript-eslint` pins the TypeScript versions it supports, so
      # TypeScript 7 arriving alone failed `npm ci` the same way. Together they
      # move when the toolchain is actually ready for it, and not before.
      typescript:
        patterns: ['typescript', 'typescript-eslint', '@typescript-eslint/*']
        update-types: [major, minor, patch]
      # Everything else: small steps together, majors on their own.
      routine:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # `@types/node` is not Node. It describes an API surface, and `engines`
      # promises `>=20.11.0` — so types from a later Node would have `tsc`
      # accept a call the supported runtime does not have, and say nothing. The
      # compiler would stop guarding that promise and start contradicting it.
      #
      # It is pinned to the floor on purpose, and it moves when `engines` moves,
      # not before. Ignored rather than closed weekly: a pull request reopened
      # every Monday and shut every Monday is the noise this file exists to
      # avoid.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels:
      - ci-cd

  # The workflow files pin actions by major tag, which is a moving target that
  # still goes stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    labels:
      - ci-cd
