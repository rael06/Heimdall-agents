<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heimdall agents</title>
<!-- Before the stylesheet, and before anything paints: the theme and the accent
     are read from it on the first line the script runs. -->
<!--{{view}}-->
<!--{{styles}}-->
</head>
<body>
<!--{{icons}}-->
<header>
  <div class="bar">
    <h1>Heimdall agents</h1>
    <span id="service-state" class="muted" data-i18n="state.connecting">connecting…</span>
    <span class="grow"></span>
    <!-- The switch for the fold below, at the far end of the title line. It is
         lit while the fold is open and dark while it is shut, like the
         notification switch: a control whose state you cannot see is one you end
         up fighting. The label is for readers who cannot see the gear. -->
    <button id="controls-toggle" class="chip" type="button" aria-expanded="false"
            aria-controls="controls" data-i18n-title="bar.controls"
            data-i18n-aria-label="bar.controls" title="Filters and settings"></button>
  </div>

  <!--
    Everything that sets the list up, behind one fold: the settings, the search,
    the sort and the filters. They are reached occasionally and they were taking
    four of the six lines standing between the title and the table.

    Not a `details`: its switch lives on the title line, and a `summary` has to
    sit with the content it opens. What the platform offers for a control that
    reveals something elsewhere is exactly this pair — `aria-expanded` on the
    button, `aria-controls` naming what it opens — and `hidden="until-found"`
    rather than a class, so find-in-page still reaches what is folded away and
    opens it to show the match.

    What deliberately stays outside is what is looked at rather than set: the two
    marker filters, the counter, and — the reason this is not a matter of taste —
    the offer to reorder, which lives inside that counter's live region. Folded
    away it would be hidden, so nothing there would be announced and the one
    action it offers could not be taken at the moment it appears.
  -->
  <div id="controls" hidden="until-found">

  <!-- The controls sit on a line of their own, under the title, rather than
       pressed against the right edge of it. Eleven of them shared that line with
       the name and the state of the service, which made one crowded row whose
       left half was text and whose right half was not — and left the state, the
       only thing on it that changes on its own, with whatever room the rest did
       not take. -->
  <div class="bar">
    <button id="open-settings" type="button" data-i18n-title="bar.settings" title="Settings">⚙</button>
    <button id="theme" type="button">Theme</button>
    <label class="swatch" data-i18n-title="bar.primary" title="Primary colour">
      <span class="sr-only" data-i18n="bar.primary">Primary colour</span>
      <input id="primary" type="color">
    </label>
    <button id="primary-random" type="button" data-i18n="bar.random"
            data-i18n-title="bar.randomTitle" title="Pick a primary colour at random">Random</button>
    <!-- The label sits in a span of its own so the icon prepended at boot is not
         wiped when `applyLanguage` rewrites the text. -->
    <button id="notify" class="chip" type="button" aria-pressed="true">
      <span class="chip-label" data-i18n="bar.notifications">Notifications</span>
    </button>
    <div id="notify-on" class="chips" role="group" aria-label="Statuses that raise a notification"></div>
    <label class="sr-only" for="notify-scope">Notify about</label>
    <select id="notify-scope">
      <option value="watched" data-i18n="notifyScope.watched">watched sessions</option>
      <option value="unacknowledged" data-i18n="notifyScope.unacknowledged">anything unacknowledged</option>
    </select>
    <button id="pause" type="button" data-i18n="bar.pause">Pause</button>
  </div>

  <div class="bar">
    <label class="search">
      <span class="sr-only">Search</span>
      <input id="query" type="search" data-i18n-placeholder="bar.search" placeholder="Search…  (/)"
             autocomplete="off">
    </label>
    <label><span data-i18n="bar.in">in</span>
      <select id="scope">
        <option value="both" data-i18n="scope.both">title and content</option>
        <option value="title" data-i18n="scope.title">title</option>
        <option value="content" data-i18n="scope.content">content</option>
      </select>
    </label>
    <label><span data-i18n="bar.sort">sort</span>
      <select id="sort">
        <option value="status-asc" data-i18n="sort.status-asc">status, most urgent first</option>
        <option value="status-desc" data-i18n="sort.status-desc">status, least urgent first</option>
        <option value="watched-desc" data-i18n="sort.watched-desc">watched first</option>
        <option value="watched-asc" data-i18n="sort.watched-asc">watched last</option>
        <option value="starred-desc" data-i18n="sort.starred-desc">starred first</option>
        <option value="starred-asc" data-i18n="sort.starred-asc">starred last</option>
        <option value="minutes-desc" data-i18n="sort.minutes-desc">minutes in this status, longest first</option>
        <option value="minutes-asc" data-i18n="sort.minutes-asc">minutes in this status, shortest first</option>
        <option value="created-desc" data-i18n="sort.created-desc">created, newest first</option>
        <option value="created-asc" data-i18n="sort.created-asc">created, oldest first</option>
        <option value="updated-desc" data-i18n="sort.updated-desc">last activity, newest first</option>
        <option value="updated-asc" data-i18n="sort.updated-asc">last activity, oldest first</option>
        <option value="provider-asc" data-i18n="sort.provider-asc">provider, A to Z</option>
        <option value="provider-desc" data-i18n="sort.provider-desc">provider, Z to A</option>
        <option value="workspace-asc" data-i18n="sort.workspace-asc">workspace, A to Z</option>
        <option value="workspace-desc" data-i18n="sort.workspace-desc">workspace, Z to A</option>
        <option value="title-asc" data-i18n="sort.title-asc">title, A to Z</option>
        <option value="title-desc" data-i18n="sort.title-desc">title, Z to A</option>
      </select>
    </label>
    <!-- Beside the sort it governs, now that both are behind the same fold: it
         decides whether that ordering re-applies as the list changes or is
         offered first. The label sits in its own span so the icon prepended at
         boot survives a language change. -->
    <button id="auto-sort" class="chip" type="button" aria-pressed="false"
            data-i18n-title="bar.autoSortTitle">
      <span class="chip-label" data-i18n="bar.autoSort">Keep sorted</span>
    </button>
    <button id="reset" type="button">
      <span class="chip-label" data-i18n="bar.reset">Reset</span>
    </button>
  </div>

  <div class="bar">
    <label><span data-i18n="bar.match">match</span>
      <select id="match">
        <option value="all" data-i18n="match.all">all of them</option>
        <option value="any" data-i18n="match.any">any of them</option>
      </select>
    </label>
    <div id="status-filters" class="chips" role="group" aria-label="Filter by status"></div>
    <div id="provider-filters" class="chips" role="group" aria-label="Filter by provider"></div>
    <details id="workspace-filter" class="picker">
      <summary><span data-i18n="bar.workspaces">Workspaces</span> <span id="workspace-count" class="muted"></span></summary>
      <div id="workspace-list" class="picker-body"></div>
    </details>
  </div>

  <!-- The dates on a line of their own. Two fields wide enough to hold a format
       hint, sitting mid-row between the chips that narrow by kind and the chips
       that narrow by marker, split that row into three things to read instead
       of two. -->
  <div class="bar">
    <label><span data-i18n="bar.from">from</span> <input id="from" type="date"></label>
    <label><span data-i18n="bar.to">to</span> <input id="to" type="date"></label>
  </div>

  <!-- What the history window and the session cap left out. Inside the fold
       with the two settings that decide it: it is those settings doing their
       job, not something going wrong, and it said the same sentence on every
       screen for as long as they stayed as they are. The notices that mean
       something *is* wrong are outside, below. -->
  <div id="truncated" role="status"></div>
  </div>

  <!-- The line that stays. Narrowing to a marker is done far more often than
       anything behind the fold, so those two keep their place on screen. -->
  <div class="bar">
    <div class="chips" role="group" aria-label="Filter by marker">
      <!-- The same eye and star the rows carry, in the same colour: a filter
           that narrows to a marker should look like the marker it narrows to,
           and these two sat grey among four status chips that all carry theirs. -->
      <button id="watched-only" class="chip chip-marker" type="button" aria-pressed="false">
        <span class="chip-label" data-i18n="bar.watched">Watched</span>
      </button>
      <button id="favorites-only" class="chip chip-marker" type="button" aria-pressed="false">
        <span class="chip-label" data-i18n="bar.starred">Starred</span>
      </button>
    </div>
    <!-- Beside the two filters rather than among the settings: grouping is
         something done to the list while reading it, like narrowing to what is
         watched, and not something set up once behind a fold. -->
    <button id="new-group" type="button" data-i18n-title="group.newTitle">
      <span class="chip-label" data-i18n="group.new">New group</span>
    </button>
    <!-- Both change for the same reason — the list moved — so they are announced
         together rather than as two unrelated interruptions. And they are out of
         the fold on purpose: a live region inside a closed `details` announces
         nothing, and the offer it holds is the one thing here that has to be
         clickable the moment it appears. -->
    <span class="live" role="status">
      <span id="counts" class="muted"></span>
      <button id="reorder" type="button" class="hidden"></button>
    </span>
    <span class="grow"></span>
    <!-- Both act on the list as it stands: one settles what is on screen, the
         other re-reads it. They belong beside the counter that says whether
         either did anything, rather than three toolbars apart among the
         settings. -->
    <button id="ack-all" type="button" data-i18n="bar.acknowledge">Acknowledge all</button>
    <button id="refresh" type="button" data-i18n-title="bar.refreshTitle"
            title="Re-scan the transcripts and redraw the list (r)">
      <span class="chip-label" data-i18n="bar.refresh">Refresh</span>
    </button>
  </div>

  <div id="notices" role="status"></div>

  <!--
    What is worth interrupting for and has nowhere on screen to live: the event
    stream dropping, a handover that led nowhere. The visible copy of these sits
    in #service-state, which is deliberately not a live region — it restates the
    last scan time every thirty seconds, and a region that speaks on a timer is
    one people switch off.
  -->
  <p id="announcer" class="sr-only" role="status"></p>
</header>

<main data-i18n-aria-label="main.label">
  <div class="scroller">
    <table id="sessions">
      <caption class="sr-only" data-i18n="table.caption">Claude and Codex sessions</caption>
      <thead>
        <tr>
          <!-- The word "status" is five times wider than the shape underneath
               it, and it set the column: 93px for a 21px glyph. It moves to
               `sr-only` and an icon takes its place, so the column still says
               what it is and still says it can be sorted. -->
          <!-- `data-column` names the column for the width the reader can drag,
               and it is the only list of them: the `col` elements the widths are
               written to are built from this row, so a column cannot be added
               here and forgotten there. -->
          <th scope="col" class="tight" data-column="status">
            <button class="sort" type="button" data-key="status">
              <span class="sr-only" data-i18n="column.status">status</span>
            </button>
          </th>
          <!-- Sortable like the columns that carry words, and wearing the same
               mark they hold, so the header says what the column is without
               taking the width of a label. -->
          <th scope="col" class="tight" data-column="watched">
            <button class="sort" type="button" data-key="watched">
              <span class="sr-only" data-i18n="column.watched">Watched</span>
            </button>
          </th>
          <th scope="col" class="tight" data-column="starred">
            <button class="sort" type="button" data-key="starred">
              <span class="sr-only" data-i18n="column.starred">Starred</span>
            </button>
          </th>
          <!-- The transcript had a column of its own, holding one button. It is
               in the row's menu now, with everything else a row can do, and a
               column that exists to carry a single icon is a column spent. -->

          <!-- A visible label, unlike the three marker columns beside it. Those
               carry an icon and hide their word; this one carried nothing at
               all, which made the header empty to look at and about six pixels
               wide to click. The full name stays as the accessible one. -->
          <th scope="col" class="num" data-column="minutes">
            <button class="sort" type="button" data-key="minutes"
                    data-i18n="column.minutesShort"
                    data-i18n-aria-label="column.minutes"
                    data-i18n-title="column.minutes">m.</button>
          </th>
          <th scope="col" data-column="created"><button class="sort" type="button" data-key="created" data-i18n="column.created">created</button></th>
          <th scope="col" data-column="updated"><button class="sort" type="button" data-key="updated" data-i18n="column.updated">last activity</button></th>
          <!-- Beside the other two dates rather than next to the eye it belongs
               to: it is read the way they are, as an answer to "when", and a
               date squeezed into a 32px marker column would be neither. -->
          <th scope="col" data-column="watchedAt"><button class="sort" type="button" data-key="watchedAt" data-i18n="column.watchedAt">watch changed</button></th>
          <th scope="col" data-column="provider"><button class="sort" type="button" data-key="provider" data-i18n="column.provider">provider</button></th>
          <th scope="col" data-column="workspace"><button class="sort" type="button" data-key="workspace" data-i18n="column.workspace">workspace</button></th>
          <th scope="col" data-column="title"><button class="sort" type="button" data-key="title" data-i18n="column.title">title</button></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p id="empty" class="empty hidden" role="status"></p>
</main>

<!--
  The colour picker. A dialog rather than a floating panel, for the same reason
  the settings are one: it is the element that traps focus, closes on Escape and
  restores focus to what opened it, all without a line of script.
-->
<!--
  Setting a status by hand.

  A dialog rather than a floating menu, like the colour picker beside it: the
  element manages its own focus trap, its own Escape, and its own backdrop —
  three things a div would have had to reimplement, and one of them badly.

  Reached by right-click on a row AND by `s` on the selected one. Not only by
  right-click: a control that exists only under a pointer is one a keyboard
  never finds, which is the same reason the brush is always drawn.
-->
<!--
  Everything a row offers, in one place.

  These actions were spread across the row itself — a click on the status, a
  button per column, a brush in two of them — and each was discoverable only by
  finding the pixel that carried it. They stay where they are, because a marker
  you can click is faster than a menu; this gathers them so there is somewhere
  to look when you cannot remember which pixel it was, and it is where a row
  joins a group.
-->
<!--
  `popover` rather than a modal dialog, and rather than a floating div.

  A menu on a row is not a decision the rest of the window has to wait for, and
  a modal said it was: it dimmed the table the menu is about and took the focus
  away from the row it was opened on. The popover is the platform's own answer —
  it closes on a click outside and on Escape, returns focus by itself, and sits
  in the top layer so no stacking context can bury it. All of that was a script
  a floating div would have had to carry, and one of those behaviours is always
  the one that gets written badly.
-->
<div id="row-menu" popover class="menu">
  <!-- One line, ellipsised. A context menu names what it is about and then
       stops: the status and its reason are on the row's own marker, a hover
       away, and a paragraph of prose at the top of a menu is what made this
       read as a dialog wearing a menu's clothes. -->
  <p id="row-menu-heading" class="menu-title"></p>
  <hr class="menu-sep">
  <button id="row-menu-ack" class="menu-item" type="button"></button>
  <hr class="menu-sep">
  <!-- Sections open to the side, the way a desktop menu does. Each is a
       `menu-sub` holding the item you point at and the flyout it opens; the
       flyout is a child so it inherits the popover's top layer, and CSS opens
       it on hover and on focus-within so a keyboard reaches it too. -->
  <div class="menu-sub">
    <button class="menu-item has-sub" type="button" aria-haspopup="true" data-i18n="rowMenu.open">Open</button>
    <div class="menu-flyout">
      <button id="row-menu-session" class="menu-item" type="button" data-i18n="rowMenu.session">Session in VS Code</button>
      <button id="row-menu-workspace-open" class="menu-item" type="button" data-i18n="rowMenu.workspaceOpen">Workspace</button>
      <button id="row-menu-transcript" class="menu-item" type="button" data-i18n="rowMenu.transcript">Raw transcript</button>
    </div>
  </div>
  <div class="menu-sub">
    <button class="menu-item has-sub" type="button" aria-haspopup="true" data-i18n="rowMenu.status">Status</button>
    <div id="row-menu-statuses" class="menu-flyout"></div>
  </div>
  <div class="menu-sub">
    <button class="menu-item has-sub" type="button" aria-haspopup="true" data-i18n="rowMenu.colour">Colour</button>
    <div class="menu-flyout">
      <button id="row-menu-provider" class="menu-item" type="button" data-i18n="rowMenu.provider">Provider…</button>
      <button id="row-menu-workspace" class="menu-item" type="button" data-i18n="rowMenu.workspace">Workspace…</button>
    </div>
  </div>
  <div class="menu-sub">
    <button class="menu-item has-sub" type="button" aria-haspopup="true" data-i18n="rowMenu.group">Group</button>
    <div id="row-menu-groups" class="menu-flyout"></div>
  </div>
</div>

<!--
  Naming a group, and renaming one.

  A dialog rather than `prompt()`, which the packaged application does not show
  at all: an Electron window answers `window.prompt` with nothing and the group
  would have been created nameless with no sign of why.
-->
<dialog id="group-name">
  <form method="dialog">
    <h2 id="group-name-heading"></h2>
    <label class="field"><span data-i18n="group.nameLabel">Name</span>
      <input id="group-name-input" type="text" maxlength="60" required autofocus>
    </label>
    <div class="bar">
      <span class="grow"></span>
      <!-- Save first, and not for the Windows convention: the browser submits a
           form on Enter with the *first* submit button in tree order, so with
           Cancel written first, typing a name and pressing Enter threw it away.
           `autofocus` on the field is what makes Enter the obvious gesture, and
           it has to reach the obvious answer. -->
      <button id="group-name-save" value="save" type="submit" data-i18n="group.save">Save</button>
      <button value="cancel" type="submit" data-i18n="group.cancel">Cancel</button>
    </div>
  </form>
</dialog>

<!--
  What a group offers: renaming it, and taking it away.

  Deleting asks nothing back. Nothing is lost by it — the sessions return to the
  pool and the sort has them again — and a confirmation on an action that
  destroys no data is a click that teaches the reader to click through them.
-->
<div id="group-menu" popover class="menu">
  <p id="group-menu-heading" class="menu-heading"></p>
  <button id="group-menu-rename" class="menu-item" type="button" data-i18n="group.rename">Rename</button>
  <button id="group-menu-delete" class="menu-item" type="button" data-i18n="group.delete">Delete</button>
</div>

<dialog id="status-picker">
  <form method="dialog">
    <h2 id="status-picker-heading"></h2>
    <p id="status-picker-inferred" class="muted"></p>
    <div id="status-picker-choices" class="chips" role="group"></div>
    <div class="bar">
      <!-- Always offered, even when nothing is set: it is how a row goes back
           to saying what the transcript says, and hiding it would make that
           depend on remembering whether you had set one. -->
      <button id="status-picker-clear" type="button" data-i18n="statusPicker.clear">
        Back to the inferred status
      </button>
      <span class="grow"></span>
      <button value="cancel" type="submit" data-i18n="settings.close">Close</button>
    </div>
  </form>
</dialog>

<dialog id="palette">
  <form method="dialog">
    <h2 id="palette-heading"></h2>
    <!-- The colour on the name it is being given to, beside the picker, because
         a swatch on its own says nothing about how it will read in the list. -->
    <!--
      The hex first, and the swatch second, because the panel behind the swatch
      opens on whichever of hex, rgb and hsl the browser last remembered — that
      selector is its own chrome and a page cannot order it. Typing here needs
      the panel not at all.
    -->
    <div class="palette-row">
      <label class="sr-only" for="palette-colour-hex" data-i18n="palette.hex">Colour, in hex</label>
      <input id="palette-colour-hex" class="hex" type="text" spellcheck="false"
             autocomplete="off" maxlength="7" placeholder="#rrggbb">
      <label class="swatch" data-i18n-title="palette.pick" title="Pick a colour">
        <span class="sr-only" data-i18n="palette.pick">Pick a colour</span>
        <input id="palette-colour" type="color">
      </label>
      <span id="palette-preview" class="tag"></span>
    </div>
    <!-- The text, chosen the same way and from the same range as the fill. The
         button beside it works out what can be read on the fill in force, which
         is what a chip starts with and what it can always be taken back to. -->
    <div class="palette-row">
      <label class="sr-only" for="palette-ink-hex" data-i18n="palette.textHex">Text colour, in hex</label>
      <input id="palette-ink-hex" class="hex" type="text" spellcheck="false"
             autocomplete="off" maxlength="7" placeholder="#rrggbb">
      <label class="swatch" data-i18n-title="palette.text" title="Text colour">
        <span class="sr-only" data-i18n="palette.text">Text colour</span>
        <input id="palette-ink" type="color">
      </label>
      <button id="palette-contrast" type="button" data-i18n="palette.contrast">Contrast it</button>
    </div>
    <div class="bar">
      <button id="palette-auto" type="button" data-i18n="palette.auto">Choose for me</button>
      <span class="grow"></span>
      <button value="cancel" type="submit" data-i18n="settings.close">Close</button>
    </div>
  </form>
</dialog>

<dialog id="settings">
  <form method="dialog">
    <h2 data-i18n="settings.heading">Settings</h2>

    <fieldset>
      <legend data-i18n="settings.languageLegend">Language and dates</legend>
      <label class="field"><span data-i18n="settings.language">Language</span>
        <select id="set-language">
          <option value="auto"></option>
          <option value="en">English</option>
          <option value="fr">Français</option>
        </select>
      </label>
      <label class="field"><span data-i18n="settings.dateLocale">Date format</span>
        <select id="set-date-locale">
          <option value="auto"></option>
          <option value="iso"></option>
          <option value="en-GB">English (01/08/2026 14:30)</option>
          <option value="en-US">English US (8/1/2026, 2:30 PM)</option>
          <option value="fr-FR">Français (01/08/2026 14:30)</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend data-i18n="settings.whereLegend">Where the transcripts are</legend>
      <p class="muted" data-i18n="settings.whereHelp"></p>
      <label class="field"><span data-i18n="settings.claudeHome">Claude home</span>
        <input id="set-claude-home" type="text" placeholder="~/.claude" spellcheck="false">
      </label>
      <label class="field"><span data-i18n="settings.codexHome">Codex home</span>
        <input id="set-codex-home" type="text" placeholder="~/.codex" spellcheck="false">
      </label>
      <div class="bar">
        <button id="detect" type="button" data-i18n="settings.detect">Detect</button>
        <span id="detect-result" class="muted"></span>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="settings.scanLegend">What is scanned</legend>
      <label class="field"><span data-i18n="settings.maxSessions">Sessions per provider</span>
        <input id="set-max" type="number" min="10" max="5000" step="10">
      </label>
      <label class="field"><span><span data-i18n="settings.history">History in days</span>
        <span class="muted" data-i18n="settings.historyHint">(0 for everything)</span></span>
        <input id="set-history" type="number" min="0" max="3650">
      </label>
      <label class="field"><span><span data-i18n="settings.stale">Inconclusive after, in minutes</span>
        <span class="muted" data-i18n="settings.staleHint">(0 for never)</span></span>
        <!-- The floor is 0, which means never, so the value the field defaults
             to has to be typable in it. -->
        <input id="set-stale" type="number" min="0" max="10080">
      </label>
      <p class="muted" data-i18n="settings.staleHelp"></p>
      <label class="check"><input id="set-subagents" type="checkbox">
        <span data-i18n="settings.subagents"></span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="settings.behaviourLegend">Behaviour</legend>
      <label class="check"><input id="set-autowatch" type="checkbox">
        <span data-i18n="settings.autowatch"></span></label>
      <!-- Saved through the notifications route rather than with the rest of
           this dialog, because the queue can take it without a restart. -->
      <label class="field"><span data-i18n="settings.notifyDelay">Wait before notifying, in seconds</span>
        <input id="set-notify-delay" type="number" min="0" max="600">
      </label>
      <p class="muted" data-i18n="settings.notifyDelayHelp"></p>
      <label class="field"><span data-i18n="settings.handoff">Window handover delay, in seconds</span>
        <input id="set-handoff" type="number" min="0" max="30">
      </label>
    </fieldset>

    <fieldset id="host-settings">
      <legend data-i18n="settings.appLegend">This application</legend>
      <label class="check"><input id="set-login" type="checkbox">
        <span data-i18n="settings.login"></span></label>
      <label class="check"><input id="set-tray" type="checkbox">
        <span data-i18n="settings.tray"></span></label>
      <p class="muted" data-i18n="settings.trayHelp"></p>
    </fieldset>

    <p id="settings-note" class="muted"></p>
    <div class="bar">
      <span class="grow"></span>
      <button value="cancel" type="submit" data-i18n="settings.close">Close</button>
      <button id="save-settings" type="button" data-i18n="settings.save">Save</button>
    </div>
  </form>
</dialog>

<!--{{i18n}}-->
<!--{{script}}-->
</body>
</html>
