<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heimdall agents</title>
<!--{{styles}}-->
</head>
<body>
<!--{{icons}}-->
<header>
  <div class="bar">
    <h1>Heimdall agents</h1>
    <span id="service-state" class="muted" data-i18n="state.connecting">connecting…</span>
    <span class="grow"></span>
    <button id="open-settings" type="button" data-i18n-title="bar.settings" title="Settings">⚙</button>
    <button id="theme" type="button">Theme</button>
    <label class="swatch" data-i18n-title="bar.primary" title="Primary colour">
      <span class="sr-only" data-i18n="bar.primary">Primary colour</span>
      <input id="primary" type="color">
    </label>
    <button id="primary-random" type="button" data-i18n="bar.random"
            data-i18n-title="bar.randomTitle" title="Pick a primary colour at random">Random</button>
    <!-- The label sits in a span of its own so the icon prepended at boot is not
         wiped when `applyLanguage` rewrites the text. -->
    <button id="notify" class="chip" type="button" aria-pressed="true">
      <span class="chip-label" data-i18n="bar.notifications">Notifications</span>
    </button>
    <div id="notify-on" class="chips" role="group" aria-label="Statuses that raise a notification"></div>
    <label class="sr-only" for="notify-scope">Notify about</label>
    <select id="notify-scope">
      <option value="watched" data-i18n="notifyScope.watched">watched sessions</option>
      <option value="unacknowledged" data-i18n="notifyScope.unacknowledged">anything unacknowledged</option>
    </select>
    <button id="pause" type="button" data-i18n="bar.pause">Pause</button>
  </div>

  <div class="bar">
    <label class="search">
      <span class="sr-only">Search</span>
      <input id="query" type="search" data-i18n-placeholder="bar.search" placeholder="Search…  (/)"
             autocomplete="off">
    </label>
    <label><span data-i18n="bar.in">in</span>
      <select id="scope">
        <option value="both" data-i18n="scope.both">title and content</option>
        <option value="title" data-i18n="scope.title">title</option>
        <option value="content" data-i18n="scope.content">content</option>
      </select>
    </label>
    <label><span data-i18n="bar.sort">sort</span>
      <select id="sort">
        <option value="status-asc" data-i18n="sort.status-asc">status, most urgent first</option>
        <option value="status-desc" data-i18n="sort.status-desc">status, least urgent first</option>
        <option value="watched-desc" data-i18n="sort.watched-desc">watched first</option>
        <option value="watched-asc" data-i18n="sort.watched-asc">watched last</option>
        <option value="starred-desc" data-i18n="sort.starred-desc">starred first</option>
        <option value="starred-asc" data-i18n="sort.starred-asc">starred last</option>
        <option value="minutes-desc" data-i18n="sort.minutes-desc">minutes in this status, longest first</option>
        <option value="minutes-asc" data-i18n="sort.minutes-asc">minutes in this status, shortest first</option>
        <option value="created-desc" data-i18n="sort.created-desc">created, newest first</option>
        <option value="created-asc" data-i18n="sort.created-asc">created, oldest first</option>
        <option value="updated-desc" data-i18n="sort.updated-desc">last activity, newest first</option>
        <option value="updated-asc" data-i18n="sort.updated-asc">last activity, oldest first</option>
        <option value="provider-asc" data-i18n="sort.provider-asc">provider, A to Z</option>
        <option value="provider-desc" data-i18n="sort.provider-desc">provider, Z to A</option>
        <option value="workspace-asc" data-i18n="sort.workspace-asc">workspace, A to Z</option>
        <option value="workspace-desc" data-i18n="sort.workspace-desc">workspace, Z to A</option>
        <option value="title-asc" data-i18n="sort.title-asc">title, A to Z</option>
        <option value="title-desc" data-i18n="sort.title-desc">title, Z to A</option>
      </select>
    </label>
    <button id="reset" type="button">
      <span class="chip-label" data-i18n="bar.reset">Reset</span>
    </button>
  </div>

  <div class="bar">
    <label><span data-i18n="bar.match">match</span>
      <select id="match">
        <option value="all" data-i18n="match.all">all of them</option>
        <option value="any" data-i18n="match.any">any of them</option>
      </select>
    </label>
    <div id="status-filters" class="chips" role="group" aria-label="Filter by status"></div>
    <div id="provider-filters" class="chips" role="group" aria-label="Filter by provider"></div>
    <details id="workspace-filter" class="picker">
      <summary><span data-i18n="bar.workspaces">Workspaces</span> <span id="workspace-count" class="muted"></span></summary>
      <div id="workspace-list" class="picker-body"></div>
    </details>
    <label><span data-i18n="bar.from">from</span> <input id="from" type="date"></label>
    <label><span data-i18n="bar.to">to</span> <input id="to" type="date"></label>
    <div class="chips" role="group" aria-label="Filter by marker">
      <!-- The same eye and star the rows carry: a filter that narrows to a
           marker should look like the marker it narrows to. -->
      <button id="watched-only" class="chip" type="button" aria-pressed="false">
        <span class="chip-label" data-i18n="bar.watched">Watched</span>
      </button>
      <button id="favorites-only" class="chip" type="button" aria-pressed="false">
        <span class="chip-label" data-i18n="bar.starred">Starred</span>
      </button>
    </div>
  </div>

  <div class="bar">
    <!-- Both change for the same reason — the list moved — so they are announced
         together rather than as two unrelated interruptions. -->
    <span class="live" role="status">
      <span id="counts" class="muted"></span>
      <button id="reorder" type="button" class="hidden"></button>
    </span>
    <span class="grow"></span>
    <!-- Both act on the list as it stands: one settles what is on screen, the
         other re-reads it. They belong beside the counter that says whether
         either did anything, rather than three toolbars apart among the
         settings. -->
    <button id="ack-visible" type="button" data-i18n="bar.acknowledge">Acknowledge visible</button>
    <button id="refresh" type="button" data-i18n-title="bar.refreshTitle"
            title="Re-scan the transcripts and redraw the list (r)">
      <span class="chip-label" data-i18n="bar.refresh">Refresh</span>
    </button>
  </div>

  <div id="notices" role="status"></div>

  <!--
    What is worth interrupting for and has nowhere on screen to live: the event
    stream dropping, a handover that led nowhere. The visible copy of these sits
    in #service-state, which is deliberately not a live region — it restates the
    last scan time every thirty seconds, and a region that speaks on a timer is
    one people switch off.
  -->
  <p id="announcer" class="sr-only" role="status"></p>
</header>

<main data-i18n-aria-label="main.label">
  <div class="scroller">
    <table id="sessions">
      <caption class="sr-only" data-i18n="table.caption">Claude and Codex sessions</caption>
      <thead>
        <tr>
          <!-- The word "status" is five times wider than the shape underneath
               it, and it set the column: 93px for a 21px glyph. It moves to
               `sr-only` and an icon takes its place, so the column still says
               what it is and still says it can be sorted. -->
          <!-- `data-column` names the column for the width the reader can drag,
               and it is the only list of them: the `col` elements the widths are
               written to are built from this row, so a column cannot be added
               here and forgotten there. -->
          <th scope="col" class="tight" data-column="status">
            <button class="sort" type="button" data-key="status">
              <span class="sr-only" data-i18n="column.status">status</span>
            </button>
          </th>
          <!-- Sortable like the columns that carry words, and wearing the same
               mark they hold, so the header says what the column is without
               taking the width of a label. -->
          <th scope="col" class="tight" data-column="watched">
            <button class="sort" type="button" data-key="watched">
              <span class="sr-only" data-i18n="column.watched">Watched</span>
            </button>
          </th>
          <th scope="col" class="tight" data-column="starred">
            <button class="sort" type="button" data-key="starred">
              <span class="sr-only" data-i18n="column.starred">Starred</span>
            </button>
          </th>
          <th scope="col" data-column="transcript"><span class="sr-only" data-i18n="column.transcript">Transcript</span></th>
          <th scope="col" class="num" data-column="minutes">
            <button class="sort" type="button" data-key="minutes">
              <span class="sr-only" data-i18n="column.minutes">Minutes in this status</span>
            </button>
          </th>
          <th scope="col" data-column="created"><button class="sort" type="button" data-key="created" data-i18n="column.created">created</button></th>
          <th scope="col" data-column="updated"><button class="sort" type="button" data-key="updated" data-i18n="column.updated">last activity</button></th>
          <th scope="col" data-column="provider"><button class="sort" type="button" data-key="provider" data-i18n="column.provider">provider</button></th>
          <th scope="col" data-column="workspace"><button class="sort" type="button" data-key="workspace" data-i18n="column.workspace">workspace</button></th>
          <th scope="col" data-column="title"><button class="sort" type="button" data-key="title" data-i18n="column.title">title</button></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p id="empty" class="empty hidden" role="status"></p>
</main>

<!--
  The colour picker. A dialog rather than a floating panel, for the same reason
  the settings are one: it is the element that traps focus, closes on Escape and
  restores focus to what opened it, all without a line of script.
-->
<dialog id="palette">
  <form method="dialog">
    <h2 id="palette-heading"></h2>
    <!-- The colour on the name it is being given to, beside the picker, because
         a swatch on its own says nothing about how it will read in the list. -->
    <!--
      The hex first, and the swatch second, because the panel behind the swatch
      opens on whichever of hex, rgb and hsl the browser last remembered — that
      selector is its own chrome and a page cannot order it. Typing here needs
      the panel not at all.
    -->
    <div class="palette-row">
      <label class="sr-only" for="palette-colour-hex" data-i18n="palette.hex">Colour, in hex</label>
      <input id="palette-colour-hex" class="hex" type="text" spellcheck="false"
             autocomplete="off" maxlength="7" placeholder="#rrggbb">
      <label class="swatch" data-i18n-title="palette.pick" title="Pick a colour">
        <span class="sr-only" data-i18n="palette.pick">Pick a colour</span>
        <input id="palette-colour" type="color">
      </label>
      <span id="palette-preview" class="tag"></span>
    </div>
    <!-- The text, chosen the same way and from the same range as the fill. The
         button beside it works out what can be read on the fill in force, which
         is what a chip starts with and what it can always be taken back to. -->
    <div class="palette-row">
      <label class="sr-only" for="palette-ink-hex" data-i18n="palette.textHex">Text colour, in hex</label>
      <input id="palette-ink-hex" class="hex" type="text" spellcheck="false"
             autocomplete="off" maxlength="7" placeholder="#rrggbb">
      <label class="swatch" data-i18n-title="palette.text" title="Text colour">
        <span class="sr-only" data-i18n="palette.text">Text colour</span>
        <input id="palette-ink" type="color">
      </label>
      <button id="palette-contrast" type="button" data-i18n="palette.contrast">Contrast it</button>
    </div>
    <div class="bar">
      <button id="palette-auto" type="button" data-i18n="palette.auto">Choose for me</button>
      <span class="grow"></span>
      <button value="cancel" type="submit" data-i18n="settings.close">Close</button>
    </div>
  </form>
</dialog>

<dialog id="settings">
  <form method="dialog">
    <h2 data-i18n="settings.heading">Settings</h2>

    <fieldset>
      <legend data-i18n="settings.languageLegend">Language and dates</legend>
      <label class="field"><span data-i18n="settings.language">Language</span>
        <select id="set-language">
          <option value="auto"></option>
          <option value="en">English</option>
          <option value="fr">Français</option>
        </select>
      </label>
      <label class="field"><span data-i18n="settings.dateLocale">Date format</span>
        <select id="set-date-locale">
          <option value="auto"></option>
          <option value="iso"></option>
          <option value="en-GB">English (01/08/2026 14:30)</option>
          <option value="en-US">English US (8/1/2026, 2:30 PM)</option>
          <option value="fr-FR">Français (01/08/2026 14:30)</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend data-i18n="settings.whereLegend">Where the transcripts are</legend>
      <p class="muted" data-i18n="settings.whereHelp"></p>
      <label class="field"><span data-i18n="settings.claudeHome">Claude home</span>
        <input id="set-claude-home" type="text" placeholder="~/.claude" spellcheck="false">
      </label>
      <label class="field"><span data-i18n="settings.codexHome">Codex home</span>
        <input id="set-codex-home" type="text" placeholder="~/.codex" spellcheck="false">
      </label>
      <div class="bar">
        <button id="detect" type="button" data-i18n="settings.detect">Detect</button>
        <span id="detect-result" class="muted"></span>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="settings.scanLegend">What is scanned</legend>
      <label class="field"><span data-i18n="settings.maxSessions">Sessions per provider</span>
        <input id="set-max" type="number" min="10" max="5000" step="10">
      </label>
      <label class="field"><span><span data-i18n="settings.history">History in days</span>
        <span class="muted" data-i18n="settings.historyHint">(0 for everything)</span></span>
        <input id="set-history" type="number" min="0" max="3650">
      </label>
      <label class="field"><span data-i18n="settings.stale">Inconclusive after, in minutes</span>
        <input id="set-stale" type="number" min="1" max="10080">
      </label>
      <p class="muted" data-i18n="settings.staleHelp"></p>
      <label class="check"><input id="set-subagents" type="checkbox">
        <span data-i18n="settings.subagents"></span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="settings.behaviourLegend">Behaviour</legend>
      <label class="check"><input id="set-autowatch" type="checkbox">
        <span data-i18n="settings.autowatch"></span></label>
      <!-- Saved through the notifications route rather than with the rest of
           this dialog, because the queue can take it without a restart. -->
      <label class="field"><span data-i18n="settings.notifyDelay">Wait before notifying, in seconds</span>
        <input id="set-notify-delay" type="number" min="0" max="600">
      </label>
      <p class="muted" data-i18n="settings.notifyDelayHelp"></p>
      <label class="field"><span data-i18n="settings.handoff">Window handover delay, in seconds</span>
        <input id="set-handoff" type="number" min="0" max="30">
      </label>
    </fieldset>

    <fieldset id="host-settings">
      <legend data-i18n="settings.appLegend">This application</legend>
      <label class="check"><input id="set-login" type="checkbox">
        <span data-i18n="settings.login"></span></label>
      <label class="check"><input id="set-tray" type="checkbox">
        <span data-i18n="settings.tray"></span></label>
      <p class="muted" data-i18n="settings.trayHelp"></p>
    </fieldset>

    <p id="settings-note" class="muted"></p>
    <div class="bar">
      <span class="grow"></span>
      <button value="cancel" type="submit" data-i18n="settings.close">Close</button>
      <button id="save-settings" type="button" data-i18n="settings.save">Save</button>
    </div>
  </form>
</dialog>

<!--{{i18n}}-->
<!--{{script}}-->
</body>
</html>
